services:
  backend:
    build: ./backend
    ports: ["3001:3001"]
    environment: [JWT_SECRET=ganti-ini, DB_FILE=/data/booking.db]
    volumes: [dbdata:/data]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment: [NUXT_PUBLIC_API_BASE=http://localhost:3001/api]
    depends_on: [backend]
volumes: { dbdata: {} }